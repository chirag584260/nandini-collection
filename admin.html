<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | NANDINI GIFT COLLECTION</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="head"><a class="logo" href="/"><div class="logo-mark">🎁</div><div class="brand">NANDINI<small>♥ GIFT COLLECTION ♥</small></div></a><div class="actions"><a class="action" href="/"><b>🏠</b>Store</a></div></div></header><section class="section"><div class="container"><div class="title"><small>PRIVATE STORE AREA</small><h2>Admin Dashboard</h2></div><div id="loginBox" class="panel" style="max-width:450px;margin:auto"><form class="form" onsubmit="login(event)"><input id="user" placeholder="Username" value="admin" required><input id="pass" type="password" placeholder="Password" required><button>Login</button></form><p class="muted">Use the ADMIN_PASSWORD environment variable in production.</p></div><div id="dash" style="display:none"><div class="stats"><div class="stat">Orders<b id="orderCount">0</b></div><div class="stat">Messages<b id="msgCount">0</b></div><div class="stat">Products<b id="prodCount">0</b></div></div><div class="panel" style="margin-top:20px"><h2>Add Product</h2><form class="form" onsubmit="addProduct(event)"><input id="pn" placeholder="Product name" required><input id="pc" placeholder="Category" required><input id="pp" type="number" placeholder="Price" required><input id="ps" type="number" placeholder="Stock" value="20"><input id="pe" placeholder="Emoji" value="🎁"><textarea id="pd" placeholder="Description"></textarea><label><input id="pf" type="checkbox"> Featured</label><button>Add Product</button></form></div><div class="panel" style="margin-top:20px"><h2>Orders</h2><div id="orders"></div></div><div class="panel" style="margin-top:20px"><h2>Messages</h2><div id="messages"></div></div><button class="btn outline" onclick="logout()">Logout</button></div></div></section><script src="/app.js"></script><script src="/admin.js"></script></body></html>
